<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 페이지 변경 전후 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    /* 콘솔 화면 색상 (실제 제품 화면 재현이라 고정) */
    --c-blue: #0d5fb3;
    --c-blue-dark: #0b55a3;
    --c-navy: #1c3f7a;
    --c-th: #e9eff7;
    --c-line: #dfe3e8;
    --c-text: #333;
    --c-red: #e5262a;
    --c-orange: #e8662c;
    --c-badge: #4a7db5;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f3f3; color: #333; font-family: var(--font); }
  /* 숫자 사이 콜론(:)이 위로 올라가 보이지 않도록 문맥 대체 글자 끄기 */
  body, button, input { font-feature-settings: "calt" 0; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f5a623; outline-offset: 2px; }


  /* ---------- 스테이지 (화면 크기에 맞춰 축소) ---------- */
  .stage-wrap { max-width: 1020px; margin: 0 auto; overflow: hidden; }
  .ver-bar { position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; gap: 10px; padding: 12px 8px; background: #f3f3f3; box-shadow: 0 1px 0 #dcdfe3; }
  .ver-bar button { border: 2px solid #cfd4da; background: #fff; color: #333; font-size: 15px; font-weight: 700; padding: 10px 24px; border-radius: 999px; }
  .ver-bar button:hover { border-color: #8a94a3; }
  .ver-bar .vb[aria-pressed="true"] { background: #4b5563; border-color: #4b5563; color: #fff; }
  .ver-bar .va[aria-pressed="true"] { background: #e8662c; border-color: #e8662c; color: #fff; }
  .logo { cursor: pointer; }
  /* 변경점 표시 */
  .chg { outline: 2px solid #e5262a; outline-offset: 3px; }
  .chg-in { outline-offset: -3px; }
  span.chg { display: inline-block; line-height: 1.2; padding: 2px 6px; outline-offset: 0; border-radius: 2px; }
  .chg-none { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 150px; height: 28px; display: grid; place-items: center; color: #e5262a; font-weight: 700; font-size: 12.5px; background: #fff7f7; }
  .chg-none[hidden] { display: none; }
  .stage { width: 1020px; position: relative; transform-origin: 0 0; background: #fff; color: var(--c-text); font-size: 13px; }

  /* 헤더: 실제 화면 캡처 이미지 위에 클릭 영역만 얹음 */
  .app-header { height: 66px; display: flex; align-items: stretch; border-bottom: 1px solid #cfd5dc; box-shadow: 0 1px 3px rgba(0,0,0,.08); position: relative; z-index: 20; background: #fff; }
  .logo { margin-right: auto; padding-left: 8px; }
  .logo img, .hdr-img { display: block; height: 65px; }
  .hdr-right { position: relative; }
  .hdr-name { position: absolute; left: 437px; top: 33px; height: 18px; display: flex; align-items: center; gap: 5px; font-size: 13px; color: #333; pointer-events: none; }
  .hdr-i { width: 14px; height: 14px; border-radius: 50%; background: #8ea6c2; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; font-family: Georgia, serif; }
  .admin-btn { position: absolute; left: 515px; top: 10px; width: 46px; height: 45px; border: 0; background: transparent; padding: 0; }
  .admin-btn[aria-expanded="true"] { background: rgba(13,95,179,.08); }
  .admin-menu { position: absolute; right: 6px; top: 66px; width: max-content; min-width: 168px; background: #fff; border: 1px solid #c9cfd6; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 22; padding-bottom: 4px; }
  .admin-menu[hidden] { display: none; }
  .admin-menu .title { margin: 0 10px; padding: 12px 4px 9px; font-weight: 700; color: var(--c-navy); border-bottom: 2px solid var(--c-blue); font-size: 13px; }
  .admin-menu button { white-space: nowrap; display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 11px 14px; font-size: 12.5px; color: #333; }
  .admin-menu button:hover { background: #f1f5fa; }

  /* 페이지 */
  .page { padding: 18px 16px 18px; }
  .page[hidden] { display: none; }
  .page-title { margin: 6px 0 16px; font-size: 26px; font-weight: 700; color: var(--c-blue); letter-spacing: -0.5px; }
  .cond.dash { border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .cond-row.tall { height: 54px; }
  .period { font-size: 13.5px; color: #444; }
  .dash-print { margin-left: 6px; height: 28px; border: 1px solid #b9c1ca; background: #fff; padding: 0 14px; font-size: 13px; color: #333; }
  .info-dot { margin-left: 10px; width: 14px; height: 14px; border-radius: 50%; background: #8ea6c2; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; font-family: Georgia, serif; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .dpanel { border: 1px solid #c9d3df; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.12); overflow: hidden; }
  .dpanel-head { background: var(--c-blue-dark); color: #fff; font-weight: 700; font-size: 14px; padding: 0 16px; height: 40px; display: flex; align-items: center; justify-content: space-between; }
  .dpanel-head button { border: 1px solid rgba(255,255,255,.75); background: transparent; color: #fff; font-size: 12.5px; padding: 3px 9px; }
  .dpanel svg.chart { display: block; width: 100%; height: 230px; }
  .legend { list-style: none; margin: 0; padding: 4px 22px 18px; font-size: 12.5px; color: #444; min-height: 64px; }
  .legend li { display: flex; align-items: center; height: 21px; }
  .legend .sw { width: 11px; height: 11px; margin-right: 5px; }
  .legend .cnt { margin-left: auto; }
  .zero { color: #e8662c; }
  .dpanel-foot { border-top: 1px solid #d5dae0; height: 40px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 0 16px; font-size: 13px; font-weight: 700; color: #333; }
  .dpanel-foot .zero { font-size: 14px; }
  .dots { width: 10px; height: 10px; color: var(--c-blue); }

  .cond { border: 1px solid var(--c-line); padding: 6px 20px; margin-bottom: 18px; }
  .cond-row { display: flex; align-items: center; height: 46px; }
  .cond-row + .cond-row { border-top: 1px solid #eef0f3; }
  .cond-label { width: 104px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
  .cond-label svg { width: 18px; height: 18px; color: var(--c-navy); }
  .date { width: 132px; height: 28px; border: 1px solid #c8ced5; display: grid; place-items: center; font-size: 13px; color: #444; }
  .tilde { margin: 0 8px; color: #777; }
  .target-sel { width: 400px; height: 28px; border: 1px solid #c8ced5; display: flex; align-items: center; gap: 6px; padding-left: 12px; color: #444; }
  .target-sel svg { width: 14px; height: 14px; color: var(--c-blue); }
  .target-sel .chev { margin-left: auto; width: 26px; height: 100%; border-left: 1px solid #c8ced5; display: grid; place-items: center; color: #888; }

  .panel { border: 1px solid #c9d3df; }
  .panel-head { background: var(--c-blue-dark); color: #fff; font-weight: 700; font-size: 14px; padding: 12px 16px; }
  .panel-tools { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px; position: relative; }
  .filter { position: relative; }
  .filter-btn { width: 150px; height: 28px; border: 1px solid #b9c1ca; background: #fff; display: flex; align-items: center; padding: 0 0 0 8px; font-size: 13px; color: #333; }
  .filter-btn .chev { margin-left: auto; width: 26px; height: 100%; display: grid; place-items: center; color: #777; border-left: 1px solid #e1e4e8; }
  .filter-list { position: absolute; left: 0; top: 29px; width: 150px; list-style: none; margin: 0; padding: 4px 0; background: #fff; border: 1px solid #b9c1ca; box-shadow: 0 4px 10px rgba(0,0,0,.12); z-index: 24; }
  .filter-list[hidden] { display: none; }
  .filter-list button { display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 7px 10px; font-size: 13px; color: #333; }
  .filter-list button:hover, .filter-list button[aria-selected="true"] { background: #eef3fa; }
  .search { width: 220px; height: 26px; border: 1px solid #c8ced5; padding: 0 8px; font-size: 12.5px; font-family: inherit; color: #333; }
  .search::placeholder { color: #a0a7b0; }
  .search-box { display: flex; gap: 3px; }
  .search-btn { height: 26px; border: 1px solid #c3c9d0; background: #e4e7eb; color: #333; font-size: 12.5px; padding: 0 14px; }
  .search-btn:hover { background: #d9dde2; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { background: var(--c-th); font-weight: 700; color: #333; font-size: 13px; height: 42px; border-bottom: 1px solid #d3dbe6; }
  th.sub { height: 40px; }
  thead tr:first-child th.grp { border-bottom: 1px solid #c5cfdc; }
  td { height: 39px; border-bottom: 1px solid #e8ebef; text-align: center; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  td.text { text-align: left; }
  tbody tr:hover td { background: #f8fafc; }
  .mag { border: 0; background: transparent; padding: 4px; color: #1d5fae; display: inline-grid; place-items: center; }
  .mag svg { width: 18px; height: 18px; }
  .empty td { height: 120px; color: #777; white-space: normal; }
  .sort-ico { width: 14px; height: 12px; vertical-align: -1px; margin-left: 2px; }
  tbody.flash td { animation: flash 0.7s ease-out; }
  @keyframes flash { from { background: #fff4cc; } to { background: transparent; } }

  .panel-foot { display: flex; align-items: center; gap: 6px; padding: 18px 12px 14px; }
  .fake-sel { height: 28px; border: 1px solid #c8ced5; display: flex; align-items: center; padding-left: 8px; font-size: 12.5px; color: #555; }
  .fake-sel .chev { margin-left: auto; width: 24px; height: 100%; border-left: 1px solid #e1e4e8; display: grid; place-items: center; color: #888; }
  .pg { width: 28px; height: 28px; border: 1px solid #c8ced5; background: #fff; color: #555; font-size: 13px; padding: 0; }
  .pg:disabled { color: #c3c8ce; cursor: default; }
  .count { margin-left: 8px; font-size: 12.5px; color: #444; }
  .excel { margin-left: auto; height: 32px; border: 1px solid #b9c1ca; background: #fff; display: flex; align-items: center; gap: 6px; padding: 0 14px; font-size: 13px; color: #333; }
  .excel svg { width: 18px; height: 18px; color: var(--c-blue); }

  .page { background: #f3f3f3; }
  #pageHome { padding: 10px 8px 16px; }
  .page-shot { display: block; }
  .audit-shot { margin: 0 0 14px -5px; }
  #pageAudit .page-title { margin: 10px 0 10px -5px; font-family: var(--font); }
  .panel { background: #fff; margin-right: 4px; }
  /* 오버레이 (화살표·강조 박스) */
  .overlay { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
  .overlay[hidden] { display: none; }
  .hl { position: absolute; border: 3px solid var(--c-red); border-radius: 2px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,38,42,.35); } 50% { box-shadow: 0 0 0 6px rgba(229,38,42,0); } }
  .arrow { position: absolute; width: 64px; height: 40px; }
  .arrow svg { width: 64px; height: 40px; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .arrow.to-right { animation: nudgeR 1.1s ease-in-out infinite; }
  .arrow.to-left { animation: nudgeL 1.1s ease-in-out infinite; }
  .arrow.to-left svg { transform: scaleX(-1); }
  @keyframes nudgeR { 50% { transform: translateX(-7px); } }
  @keyframes nudgeL { 50% { transform: translateX(7px); } }
  .callout { position: absolute; transform: translateY(-50%); background: #fff; border: 2px solid var(--c-red); padding: 8px 12px 8px 8px; display: flex; align-items: center; gap: 9px; max-width: 290px; box-shadow: 0 3px 10px rgba(0,0,0,.15); }
  .badge { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--c-badge); color: #fff; font-weight: 700; font-size: 16px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--c-badge); }
  .callout-text { font-size: 13.5px; line-height: 1.5; color: #222; font-weight: 700; }
  .callout-text small { display: block; font-weight: 400; color: #555; font-size: 12.5px; white-space: nowrap; margin-top: 2px; }
  .callout-text .indent { padding-left: 1em; }
  .shake { animation: shake 0.4s; }
  @keyframes shake { 20%,60% { translate: -5px 0; } 40%,80% { translate: 5px 0; } }

  /* 토스트 · 상세 팝업 */
  .toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); background: #2b3440; color: #fff; padding: 11px 16px; border-radius: 4px; font-size: 13px; line-height: 1.5; max-width: 520px; z-index: 40; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .toast[hidden] { display: none; }
  tr.open td { background: #f8fafc; }
  tr.detail td { background: #f4f4f4; height: auto; padding: 14px 50px 22px; white-space: normal; text-align: left; overflow: visible; }
  tr.detail:hover td { background: #f4f4f4; }
  .dl { margin: 0; display: grid; grid-template-columns: 186px 1fr; font-size: 12.5px; color: #333; }
  .dl dt, .dl dd { margin: 0; padding: 12px 14px; border-bottom: 1px dashed #dcdcdc; display: flex; align-items: center; }
  .dl dt { font-weight: 700; }
  .dl dd { white-space: pre-line; line-height: 1.55; word-break: break-all; }

  @media (prefers-reduced-motion: reduce) {
    .hl, .arrow.to-right, .arrow.to-left, .shake, tbody.flash td { animation: none; }
  }
</style>
</head>
<body>

  <button type="button" data-ver="before" class="vb">변경 전 관리자페이지</button>
  <button type="button" data-ver="after" class="va">변경 후 관리자페이지</button>
</div>
<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">

      { menu: '정보유출방지', detail: '- 선택 기간 : 2026-09-01 ~ 2026-09-30' }),
    /* 엑셀 다운로드 */
    rec('excel', '엑셀 다운로드', '일괄 다운로드 파일 정보2026-10-15 10:11:05~2026-10-22 23:59:59.xls 파일을 다운로드하였습니다.', 'min', '2026-10-15 10:12:53', { menu: '백업 〉 일괄 다운로드 내역' }),
    rec('excel', '엑셀 다운로드', '일괄 다운로드 내역2026-10-09~2026-10-15.xls 파일을 다운로드하였습니다.', 'min', '2026-10-15 10:12:49', { menu: '백업 〉 일괄 다운로드 내역' }),
    rec('excel', '엑셀 다운로드', '승인 요청 파일 백업내역2026-10-09~2026-10-15.xls 파일을 다운로드하였습니다.', 'min', '2026-10-15 10:10:25', { menu: '백업 〉 승인 요청 파일 백업내역' }),
    rec('excel', '엑셀 다운로드', '승인 요청 현황 및 승인내역_전체20261015.xls 파일을 다운로드하였습니다.', 'min', '2026-10-15 10:06:55', { menu: '승인 〉 승인 요청 현황 및 승인내역' }),
    rec('excel', '엑셀 다운로드', '실시간 검사 보고서_3.14.1-테스트.xls 파일을 다운로드하였습니다.', 'min', '2026-10-15 09:09:29', { menu: '실시간 검사 〉 실시간 검사 보고서' })
  ];

  /* 실제 화면과 건수를 맞추기 위한 보충 데이터 (접속 25건, 변경 120건) */
  function seeded(seed) {
    return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const rand = seeded(20261021);
  const pad = (n) => String(n).padStart(2, '0');
  const toMs = (str) => Date.parse(str.replace(' ', 'T') + 'Z');
  const fmt = (ms) => { const d = new Date(ms);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' +
      pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()); };
  const minutes = (lo, hi) => (lo + rand() * (hi - lo)) * 60000 + Math.floor(rand() * 60) * 1000;

  const CHANGE_TPL = [
    ['개별 설정', '“개별 설정” 을(를) 설정하였습니다.'],
    ['확장자 설정', '“확장자 설정” 을(를) 설정하였습니다.'],
    ['카테고리별 차단설정', '“카테고리별 차단설정 - 메신저” 을(를) 설정하였습니다.'],
    ['카테고리별 차단설정', '“카테고리별 차단설정 - 웹브라우저” 을(를) 설정하였습니다.'],
    ['파일첨부 차단설정', '“암호화 파일의 첨부(전송)를 허용합니다.” 로 설정하였습니다.'],
    ['파일첨부 차단설정', '“개인정보 미포함 파일의 첨부(전송)를 허용합니다.” 로 설정하였습니다.'],
    ['에이전트 배포', '에이전트 삭제 권한을 허용하였습니다.'],
    ['에이전트 배포', '에이전트 삭제 권한을 해제하였습니다.'],
    ['조직도 설정', '사용자를 추가하였습니다.'],
    ['실시간 검사 세부 설정', '“실시간 검사 세부 설정 - 검사 대상” 을(를) 설정하였습니다.']
  ];
  const CHANGERS = ['kim', 'ops', 'lee', 'min'];
  const FILLER = [];
  let t = toMs('2026-10-20 16:15:04');
  for (let i = 0; i < 110; i++) {
    t -= minutes(6, 95);
    const [cat, text] = CHANGE_TPL[Math.floor(rand() * CHANGE_TPL.length)];
    FILLER.push(rec('change', cat, text, CHANGERS[Math.floor(rand() * CHANGERS.length)], fmt(t)));
  }
  t = toMs('2026-10-20 15:22:23');
  t -= minutes(20, 180);
  FILLER.push(login('root', false, fmt(t)));
  for (let i = 0; i < 7; i++) {
    const who = CHANGERS[i % CHANGERS.length];
    t -= minutes(30, 300); FILLER.push(login(who, true, fmt(t)));
    t -= minutes(20, 240); FILLER.push(login(who, false, fmt(t)));
  }

  const DATA = FIXED.concat(FILLER).sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  DATA.forEach((r, i) => { r.id = i; });

  /* 상세 펼침에 쓰는 값 (접속 IP도 가상의 값) */
  const IP = { kim: '192.168.10.21', ops: '192.168.10.12', lee: '192.168.10.33', root: '192.168.10.2', min: '192.168.10.47' };
  const whoOf = (r) => Object.keys(ADMINS).find((k) => ADMINS[k].acct === r.acct);
  function detailOf(r) {
    if (r.cat === '에이전트 배포') {
      return '[사용자 정보]\n- 이름 : ' + r.name + '\n- 이메일 : ' + r.acct + '\n- 부서: 3.14.1-테스트\n- 통합계정 : ' + r.acct;
    }
    return '-';
  }
  const LABEL = { all: '전체', login: '접속 기록', change: '변경 기록', monthly: '월간 로그 다운로드', excel: '엑셀 다운로드' };
  const PER_PAGE = 10;

  /* 단계 정의: 어떤 요소를 가리킬지, 화살표 방향, 안내 문구 */
  const STEPS = {
    1: { el: () => $('#adminBtn'),  side: 'left',
         msg: '화면 <strong>우측 상단의 관리자 아이콘</strong>을 클릭하세요.',
         callout: '관리자 아이콘 클릭' },
    2: { el: () => $('#menuAudit'), side: 'left',
         msg: '관리자 메뉴에서 <strong>관리자 활동 감사 내역</strong>을 클릭하세요.',
         callout: '로그인 및 정책변경 내역 조회' },
    3: { el: () => $('#filterBtn'), side: 'right',
         msg: '목록 왼쪽 위의 <strong>보기 항목(전체)</strong>을 클릭해 목록을 여세요.',
         callout: '보기 항목 열기' },
    4: { el: () => $('#filterList'), side: 'right',
         msg: '원하는 항목을 선택하세요. 선택한 활동의 내역만 목록에 남습니다.',
         callout: '항목 선택<small>접속 기록: 로그인·로그아웃 내역<br>변경 기록: 정책·설정 변경 내역<br>월간 로그·엑셀 다운로드:<br><span class="indent">관리자가 파일을 받은 내역</span></small>' }
  };

  const state = { step: 5, filter: 'all', page: 1, query: '', openId: null, ver: 'before' };
  /* 변경 전후로 달라지는 부분 */
  const VER = {
    before: { menu: '로그인 및 정책변경 내역 조회', title: '로그인 및 정책변경 내역', col: '기능', filter: false },
    after:  { menu: '관리자 활동 감사 내역',       title: '관리자 활동 감사 내역',  col: '활동', filter: true }
  };
  const effFilter = () => (VER[state.ver].filter ? state.filter : 'all');
  let scale = 1;

  const stage = $('#stage'), wrap = $('#stageWrap'), overlay = $('#overlay');
  const hl = $('#hl'), arrow = $('#arrow'), callout = $('#callout');
  const adminBtn = $('#adminBtn'), adminMenu = $('#adminMenu');
  const filterBtn = $('#filterBtn'), filterList = $('#filterList');
  const tbody = $('#tbody');

  /* ---------- 화면 크기 맞춤 ---------- */
  function fit() {
    scale = Math.min(1, wrap.clientWidth / 1020);
    stage.style.transform = 'scale(' + scale + ')';
    wrap.style.height = Math.ceil(stage.offsetHeight * scale) + 'px';
    placeGuide();
  }

  /* ---------- 화살표 · 강조 박스 위치 계산 ---------- */
  function placeGuide() {
    const s = STEPS[state.step];
    if (!s) { overlay.hidden = true; return; }
    const el = s.el();
    if (!el || el.offsetParent === null) { overlay.hidden = true; return; }
    overlay.hidden = false;

    const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
    const x = (r.left - sr.left) / scale, y = (r.top - sr.top) / scale;
    const w = r.width / scale, h = r.height / scale, cy = y + h / 2;
    const AW = 64, AH = 40, GAP = 8, PAD = 4;

    Object.assign(hl.style, { left: x - PAD + 'px', top: y - PAD + 'px', width: w + PAD * 2 + 'px', height: h + PAD * 2 + 'px' });
    arrow.style.top = cy - AH / 2 + 'px';
    callout.style.top = Math.max(cy, 34) + 'px';

    if (s.side === 'left') {
      const tip = x - PAD - GAP;
      arrow.className = 'arrow to-right';
      arrow.style.left = tip - AW + 'px';
      callout.style.left = '';
      callout.style.right = (1020 - (tip - AW - 6)) + 'px';
    } else {
      const tip = x + w + PAD + GAP;
      arrow.className = 'arrow to-left';
      arrow.style.left = tip + 'px';
      callout.style.right = '';
      callout.style.left = tip + AW + 6 + 'px';
    }
    $('#badge').textContent = state.step;
    $('#calloutText').innerHTML = s.callout;
  }

  /* ---------- 가이드 진행 ---------- */
  function go(step, detail) {
    state.step = step;
    requestAnimationFrame(placeGuide);
  }

  function nudge() {
    [hl, callout].forEach((n) => { n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); });
  }

  /* 가이드 진행 중에는 지정된 곳만 클릭 가능 */
  stage.addEventListener('click', (e) => {
    const s = STEPS[state.step];
    if (!s) return;
    if (s.el().contains(e.target)) return;
    e.stopPropagation();
    e.preventDefault();
    nudge();
  }, true);

  /* ---------- 관리자 메뉴 ---------- */
  function setMenu(open) {
    open = true; /* 관리자 메뉴는 항상 펼쳐 둠 */
    adminMenu.hidden = !open;
    adminBtn.setAttribute('aria-expanded', String(open));
  }
  adminBtn.addEventListener('click', () => {
    setMenu(adminMenu.hidden);
    if (state.step === 1) go(2);
  });
  $('#menuAudit').addEventListener('click', () => {
    setMenu(false);
    $('#pageHome').hidden = true;
    $('#pageAudit').hidden = false;
    renderTable();
    if (state.step === 2) go(3); else fit();
  });
  document.querySelectorAll('[data-out]').forEach((b) =>
    b.addEventListener('click', () => toast('이 체험에서는 ‘' + VER[state.ver].menu + '’ 화면만 열어볼 수 있습니다.')));

  /* ---------- 보기 항목 드롭다운 ---------- */
  function setList(open) {
    filterList.hidden = !open;
    filterBtn.setAttribute('aria-expanded', String(open));
  }
  filterBtn.addEventListener('click', () => {
    setList(filterList.hidden);
    if (state.step === 3) go(4);
  });
  filterList.addEventListener('click', (e) => {
    const b = e.target.closest('[data-opt]');
    if (!b) return;
    const v = b.dataset.opt;
    setList(false);
    state.filter = v;
    state.page = 1;
    $('#filterLabel').textContent = LABEL[v];
    filterList.querySelectorAll('[data-opt]').forEach((o) => o.setAttribute('aria-selected', String(o.dataset.opt === v)));
    renderTable(true);
    if (state.step >= 4) go(5);
  });

  /* 완료 후 자유 체험: 바깥 클릭 시 열린 목록 닫기 */
  document.addEventListener('click', (e) => {
    if (STEPS[state.step]) return;
    if (!adminMenu.hidden && !e.target.closest('.hdr-right')) setMenu(false);
    if (!filterList.hidden && !e.target.closest('#filterWrap')) setList(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!STEPS[state.step]) { setMenu(false); setList(false); }
  });

  /* ---------- 표 ---------- */
  function rowsNow() {
    const q = state.query.trim().toLowerCase();
    return DATA.filter((r) =>
      (effFilter() === 'all' || r.type === effFilter()) &&
      (!q || [r.cat, r.text, r.name, r.acct, r.at].join(' ').toLowerCase().includes(q)));
  }
  function td(text, cls) {
    const c = document.createElement('td');
    c.textContent = text;
    c.title = text;
    if (cls) c.className = cls;
    return c;
  }
  function renderTable(flash) {
    const rows = rowsNow();
    if (flash) state.openId = null;
    const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    state.page = Math.min(state.page, pages);
    const start = (state.page - 1) * PER_PAGE;
    const slice = rows.slice(start, start + PER_PAGE);

    tbody.replaceChildren();
    slice.forEach((r) => {
      const tr = document.createElement('tr');
      const c0 = document.createElement('td');
      const mag = document.createElement('button');
      mag.type = 'button';
      mag.className = 'mag';
      const isOpen = state.openId === r.id;
      mag.setAttribute('aria-label', isOpen ? '상세 닫기' : '상세 보기');
      mag.setAttribute('aria-expanded', String(isOpen));
      mag.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg>';
      mag.addEventListener('click', () => { state.openId = isOpen ? null : r.id; renderTable(); });
      c0.appendChild(mag);
      tr.append(c0, td(r.cat), td(r.text, 'text'), td(r.name), td(r.acct), td('전체'), td('모든 권한'), td(r.at));
      tbody.appendChild(tr);
      if (isOpen) { tr.className = 'open'; tbody.appendChild(detailRow(r)); }
    });
    if (!slice.length) {
      const tr = document.createElement('tr');
      tr.className = 'empty';
      const c = document.createElement('td');
      c.colSpan = 8;
      c.textContent = '조건에 맞는 내역이 없습니다. 검색어를 지우거나 다른 보기 항목을 선택하세요.';
      tr.appendChild(c);
      tbody.appendChild(tr);
    }
    $('#count').textContent = '( 전체 ' + rows.length + '개 중 ' + (slice.length ? start + 1 : 0) + ' - ' + (start + slice.length) + ' )';
    $('#pageLabel').textContent = state.page + ' 페이지';
    $('#prev').disabled = state.page <= 1;
    $('#next').disabled = state.page >= pages;
    tbody.classList.remove('flash');
    if (flash) { void tbody.offsetWidth; tbody.classList.add('flash'); }
  }
  function detailRow(r) {
    const tr = document.createElement('tr');
    tr.className = 'detail';
    const c = document.createElement('td');
    c.colSpan = 8;
    const dl = document.createElement('dl');
    dl.className = 'dl';
    [['메뉴', r.menu || r.cat], [VER[state.ver].col, r.act || r.cat], ['내용', r.text], ['상세 내용', r.detail || detailOf(r)],
     ['관리자 이름', r.name], ['통합계정', r.acct], ['관리범위', '전체'], ['관리권한', '모든 권한'],
     ['관리자 접속 IP', IP[whoOf(r)]], ['시각', r.at]].forEach(([k, v]) => {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    });
    c.appendChild(dl);
    tr.appendChild(c);
    return tr;
  }
  $('#prev').addEventListener('click', () => { state.page--; state.openId = null; renderTable(); });
  $('#next').addEventListener('click', () => { state.page++; state.openId = null; renderTable(); });
  function runSearch() { state.query = $('#search').value; state.page = 1; renderTable(true); }
  $('#searchBtn').addEventListener('click', runSearch);
  $('#search').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
  $('#search').addEventListener('search', runSearch);
  function excelToast() { toast('엑셀 다운로드: 실제 콘솔에서는 현재 조회 중인 목록이 엑셀 파일로 저장됩니다.'); }
  $('#excelBtn').addEventListener('click', excelToast);

  /* ---------- 토스트 ---------- */
  let toastTimer;
  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  /* ---------- 변경 전 / 변경 후 전환 (보고 있던 화면은 그대로 유지) ---------- */
  function setVersion(v) {
    state.ver = v;
    const t = VER[v];
    $('#menuAudit').textContent = t.menu;
    $('#pageTitle').textContent = t.title;
    $('#panelTitle').textContent = t.title;
    $('#colAct').textContent = t.col;
    setList(false);
    $('#filterWrap').style.visibility = t.filter ? '' : 'hidden';
    $('#filterNone').hidden = t.filter;
    document.querySelectorAll('[data-ver]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ver === v)));
    renderTable();
    fit();
  }
  document.querySelectorAll('[data-ver]').forEach((b) => b.addEventListener('click', () => setVersion(b.dataset.ver)));

  function goHome() {
    setMenu(false); setList(false);
    $('#pageAudit').hidden = true;
    $('#pageHome').hidden = false;
    fit();
  }
  document.querySelector('.logo').addEventListener('click', goHome);

  new ResizeObserver(fit).observe(wrap);
  new ResizeObserver(fit).observe(stage);
  overlay.hidden = true;
  setVersion('before');
  goHome();
})();
</script>
</body>
</html>
